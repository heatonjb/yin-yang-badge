<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certified: 100% Organic Handcrafted vs 100% AI Agentic</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --fg: #f4f4f4;
            --accent: #7c3aed;
            --accent-2: #06b6d4;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "JetBrains Mono", monospace;
        }
        body {
            background: radial-gradient(circle at top, #1a1a1a, var(--bg));
            color: var(--fg);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 2rem 1rem;
            line-height: 1.5;
        }
        header {
            text-align: center;
            max-width: 680px;
        }
        header h1 {
            font-size: clamp(1.8rem, 4vw, 3rem);
            margin-bottom: 0.5rem;
            text-wrap: balance;
        }
        header p {
            opacity: 0.8;
            text-wrap: balance;
        }
        .badge-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            backdrop-filter: blur(12px);
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            min-width: 220px;
        }
        label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.7;
        }
        input {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: var(--fg);
            padding: 0.4rem 0.6rem;
            font: inherit;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        button {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.8), rgba(6, 182, 212, 0.8));
            color: var(--fg);
            font: inherit;
            padding: 0.6rem 1.2rem;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 160ms ease, border 160ms ease;
        }
        button.secondary {
            background: transparent;
        }
        button:hover {
            transform: translateY(-1px);
            border-color: var(--fg);
        }
        svg {
            max-width: min(90vw, 520px);
            height: auto;
            filter: drop-shadow(0 30px 60px rgba(124, 58, 237, 0.25));
        }
        footer {
            text-align: center;
            opacity: 0.6;
            font-size: 0.9rem;
        }
        .glow {
            background: radial-gradient(circle, rgba(124, 58, 237, 0.4) 0%, transparent 70%);
            filter: blur(60px);
            height: 240px;
            width: 240px;
            position: fixed;
            pointer-events: none;
            top: -80px;
            right: -80px;
            z-index: -1;
        }
        .glow.alt {
            left: -120px;
            top: auto;
            bottom: -160px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, transparent 70%);
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="glow alt"></div>
    <header>
        <h1>100% Organic Handcrafted Code ∩ 100% AI Agentic</h1>
        <p>A philosophical crisis for your README. Print it. Pin it. Explain the paradox to your team.</p>
    </header>
    <section class="badge-stage">
        <svg id="badge" width="640" height="320" viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yin Yang badge reading organic handcrafted code vs agentic">
            <defs>
                <clipPath id="left">
                    <rect x="20" y="30" width="300" height="260" />
                </clipPath>
                <clipPath id="right">
                    <rect x="320" y="30" width="300" height="260" />
                </clipPath>
            </defs>
            <rect x="16" y="26" width="608" height="268" rx="18" fill="#050505" stroke="url(#stroke)" stroke-width="2" />
            <defs>
                <linearGradient id="stroke" x1="0" y1="0" x2="640" y2="0">
                    <stop offset="0%" stop-color="#22c55e" />
                    <stop offset="50%" stop-color="#a855f7" />
                    <stop offset="100%" stop-color="#38bdf8" />
                </linearGradient>
                <linearGradient id="organic" x1="0" y1="0" x2="0" y2="320">
                    <stop offset="0%" stop-color="#14532d" />
                    <stop offset="100%" stop-color="#052e16" />
                </linearGradient>
                <linearGradient id="agentic" x1="0" y1="0" x2="0" y2="320">
                    <stop offset="0%" stop-color="#0f172a" />
                    <stop offset="100%" stop-color="#020617" />
                </linearGradient>
            </defs>
            <g clip-path="url(#left)">
                <rect x="20" y="30" width="300" height="260" fill="url(#organic)" />
                <g opacity="0.9">
                    <path d="M 170 60 C 120 60, 90 90, 90 130 C 90 180, 130 210, 170 210 C 150 190, 140 160, 140 130 C 140 100, 150 80, 170 60 Z" fill="#86efac" />
                    <path d="M 170 80 C 150 95, 145 110, 145 130 C 145 150, 150 170, 170 190 C 190 170, 195 150, 195 130 C 195 110, 190 95, 170 80 Z" fill="#052e16" />
                    <text id="leftLabel" x="170" y="240" text-anchor="middle" font-size="14" fill="#bbf7d0">100% ORGANIC HANDCRAFTED CODE</text>
                </g>
            </g>
            <g clip-path="url(#right)">
                <rect x="320" y="30" width="300" height="260" fill="url(#agentic)" />
                <g opacity="0.95">
                    <circle cx="470" cy="130" r="55" stroke="#38bdf8" stroke-width="6" fill="none" opacity="0.6" />
                    <circle cx="470" cy="130" r="18" fill="#38bdf8" />
                    <path d="M 470 75 L 470 95 M 470 165 L 470 185 M 415 130 L 435 130 M 505 130 L 525 130 M 430 90 L 442 102 M 498 168 L 510 180 M 430 170 L 442 158 M 498 92 L 510 80" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.8" />
                    <text id="rightLabel" x="470" y="240" text-anchor="middle" font-size="14" fill="#67e8f9">100% AI AGENTIC</text>
                </g>
            </g>
            <circle cx="320" cy="160" r="28" fill="#050505" stroke="url(#stroke)" stroke-width="2" />
            <circle cx="320" cy="148" r="8" fill="#22c55e" />
            <circle cx="320" cy="172" r="8" fill="#38bdf8" />
            <text x="320" y="55" text-anchor="middle" font-size="12" fill="#e5e7eb" letter-spacing="0.4em" text-transform="uppercase">CERTIFIED PARADOX</text>
        </svg>
        <div class="controls">
            <div class="control-group">
                <label for="leftText">Left side text</label>
                <input id="leftText" value="100% ORGANIC HANDCRAFTED CODE" />
            </div>
            <div class="control-group">
                <label for="rightText">Right side text</label>
                <input id="rightText" value="100% AI AGENTIC" />
            </div>
            <div class="control-group">
                <label for="tagline">Top tagline</label>
                <input id="tagline" value="CERTIFIED PARADOX" />
            </div>
        </div>
        <div class="actions">
            <button id="downloadSvg">Download SVG</button>
            <button id="downloadPng" class="secondary">Download PNG</button>
            <button id="vibeShift" class="secondary">Vibe shift</button>
        </div>
    </section>
    <footer>
        <p>For README files that refuse to pick a lane. Made with equal parts love and recursion.</p>
    </footer>
    <script>
        const leftInput = document.getElementById("leftText");
        const rightInput = document.getElementById("rightText");
        const taglineInput = document.getElementById("tagline");
        const leftLabel = document.getElementById("leftLabel");
        const rightLabel = document.getElementById("rightLabel");
        const topText = document.querySelector("#badge text[letter-spacing]");
        const svg = document.getElementById("badge");
        const vibeShift = document.getElementById("vibeShift");

        leftInput.addEventListener("input", () => (leftLabel.textContent = leftInput.value));
        rightInput.addEventListener("input", () => (rightLabel.textContent = rightInput.value));
        taglineInput.addEventListener("input", () => (topText.textContent = taglineInput.value));

        document.getElementById("downloadSvg").addEventListener("click", () => {
            const serializer = new XMLSerializer();
            const source = serializer.serializeToString(svg);
            const blob = new Blob(["<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n" + source], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "yin-yang-paradox.svg";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        document.getElementById("downloadPng").addEventListener("click", () => {
            const serializer = new XMLSerializer();
            const source = serializer.serializeToString(svg);
            const svgData = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);
            const img = new Image();
            const canvas = document.createElement("canvas");
            const scale = 2;
            canvas.width = svg.width.baseVal.value * scale;
            canvas.height = svg.height.baseVal.value * scale;
            const ctx = canvas.getContext("2d");
            img.onload = () => {
                ctx.scale(scale, scale);
                ctx.drawImage(img, 0, 0);
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "yin-yang-paradox.png";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
            };
            img.src = svgData;
        });

        const vibes = [
            { left: "100% ORGANIC HANDCRAFTED CODE", right: "100% AI AGENTIC", tagline: "CERTIFIED PARADOX" },
            { left: "MADE WITH LOVE AND KEYSTROKES", right: "MADE BY VIBE CODING AT 2AM", tagline: "BOTH CAN BE TRUE" },
            { left: "HUMAN SWEAT", right: "TOKEN SWEAT", tagline: "CONFLICT OF INTEREST" },
            { left: "CTRL+C, CTRL+V FROM STACKOVERFLOW", right: "CTRL+TAB TO CLAUDE", tagline: "GENERATIONAL TRAUMA" },
            { left: "CAREFULLY CRAFTED BY A HUMAN", right: "GENERATED BY A SYSTEM PROMPT", tagline: "SCHRÖDINGER'S COMMIT" },
        ];
        let idx = 0;
        vibeShift.addEventListener("click", () => {
            idx = (idx + 1) % vibes.length;
            leftInput.value = vibes[idx].left;
            rightInput.value = vibes[idx].right;
            taglineInput.value = vibes[idx].tagline;
            leftLabel.textContent = vibes[idx].left;
            rightLabel.textContent = vibes[idx].right;
            topText.textContent = vibes[idx].tagline;
        });
    </script>
</body>
</html>
